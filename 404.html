<!DOCTYPE html>
<html lang="ru">
<!-- Страница двуязычная, и это не прихоть: хостинг отдаёт ОДИН файл
     404 на весь сайт, включая /en/. Отдельной en/404.html просто
     некуда подключиться. До v85 англоязычный посетитель, попавший на
     битую ссылку, видел страницу целиком по-русски.
     lang="ru" у документа оставлен (русский блок идёт первым), у
     английского блока свой lang="en" — чтобы скринридер читал его с
     правильным произношением. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · Page not found — Организованная Культурность</title>
<meta name="theme-color" content="#0A0A0A">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#0A0A0A;color:#F5F2ED;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    min-height:100vh;min-height:100svh;  /* 100svh — высота БЕЗ панели
    адреса браузера. На телефоне 100vh считается по развёрнутому
    экрану, поэтому часть содержимого уезжает под панель и доскроллить
    до неё на короткой странице нельзя. Строка с 100vh оставлена выше
    как запасная для браузеров, которые svh не знают. */display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  svg{width:140px;height:auto;margin-bottom:32px;}
  h1{font-weight:300;font-size:1.375rem;margin-bottom:12px;}
  p{color:#9A968E;font-size:0.9375rem;margin-bottom:28px;}
  a{color:#D97757;text-decoration:none;border:1px solid rgba(217,119,87,.4);border-radius:999px;padding:10px 20px;font-size:0.875rem;}
  a:hover{background:rgba(217,119,87,.12);}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  /* Английский блок отделён линией, а не спрятан за определением языка
     браузера: угадывать язык на странице-ошибке нечем (адрес, по
     которому человек не попал, ничего не говорит о его языке), а
     скрытый блок не нашёл бы тот, кому он нужен. */
  .en{margin-top:36px;padding-top:28px;border-top:1px solid #262523;width:100%;max-width:420px;}
  .en h1{font-size:1.1875rem;}
  .en p{font-size:0.875rem;margin-bottom:22px;}
</style>
</head>
<body>
  <svg viewBox="140 240 800 600" fill="none" stroke="#F5F2ED" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="364" cy="540" rx="200" ry="110"/>
    <path d="M 764 264 L 764 816 M 764 540 L 916 264 M 764 540 L 916 816"/>
  </svg>
  <h1>Такой страницы здесь нет</h1>
  <p>Возможно, текст переехал или ссылка устарела.</p>
  <div class="links">
    <a href="/">На главную</a>
    <a href="/texts/">К текстам</a>
  </div>
<!-- Счётчики. Страница самодостаточная (свой <style>, без assets/),
     поэтому сниппеты вписаны сюда вручную, а не подключены файлом.
     Зачем счётчик на 404: это единственный способ узнать, по каким
     адресам к нам приходят и не попадают — битые внешние ссылки,
     опечатки в напечатанных QR-кодах, старые пути после переименования
     страниц. Без него такие заходы не видно вообще: человек упёрся в
     «не найдено» и ушёл молча.
     Метрика, как и везде, — только после согласия на cookie (своего
     баннера здесь нет: если согласия ещё не было, она не грузится).
     Обезличенный счётчик (с v70, см. own_stats_snippet в gen.py) —
     у всех: в суммы дня уходят «/404», адрес, по которому не попали
     (без параметров), домен источника и тип устройства; без cookie, IP
     и идентификатора. Время прошлого захода — ok_seen в браузере, на
     сервер не уходит.
     ⚠️ Номер счётчика Метрики и адрес функции (ACCOUNT_API) продублированы
     здесь из gen.py — это зарегистрированные факты, см.
     registry/facts.json. Меняешь там — меняй и тут. -->
<script type="text/javascript">
  (function () {
    var API = 'https://functions.yandexcloud.net/ЗАМЕНИ-НА-ID-ФУНКЦИИ';
    if (API.indexOf('ЗАМЕНИ') !== -1 || !navigator.sendBeacon) return;
    try {
      var now = Date.now(), last = 0;
      try { last = parseInt(localStorage.getItem('ok_seen'), 10) || 0; localStorage.setItem('ok_seen', String(now)); } catch (e) { last = -1; }
      var ref = '';
      try { ref = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) {}
      var inside = ref === location.hostname, known = last > 0, a = new Date(now), b = new Date(known ? last : 0);
      var visit = known ? now - last > 30 * 60 * 1000 : (last === 0 || !inside);
      var mon = function (d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x.getTime(); };
      var vw = window.innerWidth || 0;
      var send = function (o) { navigator.sendBeacon(API + '?r=stats.hit', new Blob([JSON.stringify(o)], { type: 'text/plain' })); };
      send({ p: '/404', x: location.pathname, r: inside ? '' : ref, d: vw < 768 ? 'm' : vw < 1100 ? 't' : 'd', v: +visit,
        n: known ? +(a.toDateString() !== b.toDateString()) : +visit, w: known ? +(mon(a) !== mon(b)) : +visit,
        mo: known ? +(a.getFullYear() !== b.getFullYear() || a.getMonth() !== b.getMonth()) : +visit });
      send({ e: 'page_not_found', p: '/404' });
    } catch (e) {}
  })();
</script>
<script type="text/javascript">
  if (localStorage.getItem('ok_cookie_consent') === '1') {
    (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
    })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=111176053', 'ym');
    ym(111176053, 'init', {ssr:true, webvisor:true, clickmap:true, accurateTrackBounce:true, trackLinks:true});
    // Цель page_not_found (с v87): без неё 404 видна только как
    // просмотр страницы, и в отчётах не отделить «человек зашёл
    // посмотреть» от «человек не попал». Адрес, по которому не
    // попали, идёт параметром визита — иначе цель говорит, что
    // промахи есть, но не говорит куда.
    ym(111176053, 'reachGoal', 'page_not_found', { requested: location.pathname });
  }
</script>
</body>
</html>
